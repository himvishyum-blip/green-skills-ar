<!DOCTYPE html>
<html>
<head>
  <title>Green Skills AR Quest</title>
  <!-- Load A-Frame for 3D/AR -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- Load Teachable Machine libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    #webcam-container { position: absolute; top: 0; left: 0; z-index: -1; width: 100vw; height: 100vh; overflow: hidden; }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    #score-board { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; font-family: Arial; z-index: 10; text-shadow: 2px 2px 4px #000; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;" onload="init()">
  
  <div id="score-board">Score: <span id="score">0</span></div>
  <div id="webcam-container"></div>

  <!-- A-Frame Scene (Transparent background to show webcam) -->
  <a-scene alpha="true" vr-mode-ui="enabled: false">
    <a-assets>
      <a-asset-item id="treeModel" src="tree.glb"></a-asset-item>
    </a-assets>
    
    <!-- This tree is hidden by default. It appears when plastic is detected. -->
    <a-entity id="ar-tree" gltf-model="#treeModel" position="0 -1 -3" scale="0.5 0.5 0.5" visible="false" 
              animation="property: scale; from: 0 0 0; to: 0.5 0.5 0.5; dur: 1000; startEvents: grow">
    </a-entity>
    
    <a-camera position="0 0 0"></a-camera>
  </a-scene>

  <script>
    // Paste your Teachable Machine URL here
    const URL = "https://teachablemachine.withgoogle.com/models/qCntUeanjC/";
    let model, webcam, maxPredictions;
    let score = 0;
    let isHealed = false;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Setup webcam
        const flip = false; 
        webcam = new tmImage.Webcam(640, 480, flip);
        await webcam.setup({ facingMode: "environment" }); // Use back camera
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").appendChild(webcam.canvas);
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        const treeEntity = document.getElementById('ar-tree');
        
        for (let i = 0; i < maxPredictions; i++) {
            // If the AI is over 90% sure it sees a Plastic Bottle
            if (prediction[i].className === "Plastic Bottle" && prediction[i].probability.toFixed(2) > 0.90) {
                if (!isHealed) {
                    treeEntity.setAttribute('visible', 'true');
                    treeEntity.emit('grow'); // Trigger A-Frame growth animation
                    score += 10;
                    document.getElementById('score').innerText = score;
                    isHealed = true;
                    
                    // Reset after 5 seconds to play again
                    setTimeout(() => {
                        treeEntity.setAttribute('visible', 'false');
                        isHealed = false;
                    }, 5000);
                }
            }
        }
    }
  </script>
</body>
</html>
